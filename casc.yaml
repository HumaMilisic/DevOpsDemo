jenkins:
  # 1. System Configuration via JCasC
  systemMessage: "🚀 Welcome to your fully automated Jenkins environment! Configured via JCasC."
  numExecutors: 2
  mode: NORMAL
  
# 2. Job Creation via Job DSL
jobs:
  - script: >
      folder('My-Automated-Projects') {
          description('A folder created on startup')
      }

      pipelineJob('My-Automated-Projects/Hello-World-Pipeline') {
          description('This pipeline was injected at boot time.')
          definition {
              cps {
                  // We are using an inline script here so it works out of the box.
                  // In reality, you would point this to a Git repository using cpsScm.
                  script('''
                      pipeline {
                          agent any
                          stages {
                              stage('Verify Setup') {
                                  steps {
                                      echo '✅ JCasC and Job DSL are working perfectly!'
                                      sh 'java -version'
                                  }
                              }
                          }
                      }
                  '''.stripIndent())
                  sandbox(true)
              }
          }
      }